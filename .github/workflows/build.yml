name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          cache: true

      - name: Initialize Flutter Project Structure
        run: |
          mkdir -p temp_lib temp_pub
          if [ -f "main.dart" ]; then cp main.dart temp_lib/; fi
          if [ -f "pubspec.yaml" ]; then cp pubspec.yaml temp_pub/; fi
          
          flutter create . --org com.tradingvoice --project-name trading_voice_app --platforms=android
          
          if [ -f "temp_lib/main.dart" ]; then cp temp_lib/main.dart lib/; fi
          if [ -f "temp_pub/pubspec.yaml" ]; then cp temp_pub/pubspec.yaml ./; fi
          
          flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-pub
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
