name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Find Project Directory and Build
        run: |
          # Find the directory containing pubspec.yaml automatically
          PROJECT_DIR=$(dirname $(find . -name "pubspec.yaml" -not -path "*/.*" -print -quit))
          echo "Found project root at: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: '**/build/app/outputs/flutter-apk/*.apk'
